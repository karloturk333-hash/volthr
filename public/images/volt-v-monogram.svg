<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
    </style>
    <!-- Subtle gradient for depth on the V -->
    <linearGradient id="voltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter for the bolt accent -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background — Warm White -->
  <rect width="800" height="800" rx="40" fill="#F5F4F0"/>

  <!-- 
    V Monogram — geometric, bold, with a lightning-bolt negative space cut 
    The V is constructed from two angled bars that meet at a sharp point,
    with a subtle bolt-shaped cut through the right bar.
  -->
  
  <!-- Main V shape — bold geometric letterform -->
  <path d="
    M 220 200
    L 400 600
    L 580 200
    L 500 200
    L 400 480
    L 300 200
    Z
  " fill="url(#voltGrad)" />

  <!-- Lightning bolt negative space cut — brand differentiator -->
  <!-- Small bolt shape carved from the right arm of the V -->
  <path d="
    M 468 260
    L 448 340
    L 478 340
    L 452 420
    L 496 320
    L 466 320
    L 488 260
    Z
  " fill="#F5F4F0" />

  <!-- ✦ Brand accent dot — top right -->
  <text x="590" y="215" 
        font-family="'Space Grotesk', sans-serif" 
        font-size="28" 
        fill="#8B5CF6" 
        font-weight="700"
        opacity="0.7">✦</text>

  <!-- "VOLT" wordmark below — small, tracked, confident -->
  <text x="400" y="680" 
        font-family="'Space Grotesk', sans-serif" 
        font-size="42" 
        font-weight="700" 
        fill="#0D0D0D" 
        text-anchor="middle" 
        letter-spacing="12">VOLT</text>

  <!-- Subtle tagline -->
  <text x="400" y="715" 
        font-family="'DM Sans', 'Space Grotesk', sans-serif" 
        font-size="13" 
        fill="#999994" 
        text-anchor="middle" 
        letter-spacing="4"
        text-transform="uppercase">STUDIO</text>
</svg>