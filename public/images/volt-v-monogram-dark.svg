<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
    </style>
  </defs>

  <!-- Dark background — Near Black -->
  <rect width="800" height="800" rx="40" fill="#0D0D0D"/>

  <!-- 
    Alt V Monogram — the V IS a lightning bolt
    Instead of carving a bolt from the V, the entire V letterform 
    is shaped like a stylized bolt with angular, electric edges.
  -->
  
  <!-- V-as-bolt shape — asymmetric, electric, dynamic -->
  <path d="
    M 260 190
    L 370 390
    L 310 390
    L 400 610
    L 490 390
    L 430 390
    L 540 190
    L 460 190
    L 400 330
    L 340 190
    Z
  " fill="#8B5CF6" />

  <!-- ✦ Brand accent -->
  <text x="555" y="205" 
        font-family="'Space Grotesk', sans-serif" 
        font-size="24" 
        fill="#8B5CF6" 
        font-weight="700"
        opacity="0.5">✦</text>

  <!-- "VOLT" wordmark — white on dark -->
  <text x="400" y="690" 
        font-family="'Space Grotesk', sans-serif" 
        font-size="42" 
        font-weight="700" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="12">VOLT</text>

  <!-- Tagline -->
  <text x="400" y="725" 
        font-family="'DM Sans', 'Space Grotesk', sans-serif" 
        font-size="13" 
        fill="#999994" 
        text-anchor="middle" 
        letter-spacing="4">STUDIO</text>
</svg>